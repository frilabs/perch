name: Pages

# Publishes ONLY the pages/ folder (Perch's OAuth Client ID Metadata Document for Luma, docs/LUMA_SPEC.md §3).
# One-time setup by the repo owner: Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: ['pages/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the metadata document
        run: node -e "const d=require('./pages/luma-client.json'); if(d.client_id!=='https://fritzkuermayr.github.io/perch/luma-client.json'||d.token_endpoint_auth_method!=='none') process.exit(1)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
